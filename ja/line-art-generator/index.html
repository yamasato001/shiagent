<!doctype html>
<html lang="ja" data-page-lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ローカルAI線画ジェネレーター — 保留中 | SHIAGENT</title>
  <meta name="description" content="ローカルAI線画ジェネレーターは品質と一般的なPC環境での実用性を再検討するため、現在保留中です。">
  <link rel="canonical" href="/ja/line-art-generator/">
  <link rel="alternate" hreflang="ja" href="/ja/line-art-generator/">
  <link rel="alternate" hreflang="en" href="/line-art-generator/">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="SHIAGENT ホーム"><span>SHIAGENT</span><small>シアゲント</small></a>
    <nav aria-label="メインナビゲーション"><a href="/ja/png-compressor/">ツール</a></nav>
    <div class="language" aria-label="言語"><a href="/line-art-generator/">EN</a><span aria-current="page">日本語</span></div>
  </header>
  <main>
    <section class="tool-hero">
      <div class="breadcrumb"><a href="/">SHIAGENT</a><span>/</span><span>ローカルAI線画ジェネレーター</span></div>
      <div class="eyebrow"><span>R&amp;D</span><span class="on-device">PENDING</span></div>
      <h1>線画生成は<br>いったん保留。</h1>
      <p class="lead">一般的なPC環境で使える品質と速度に届かなかったため、<br>ローカルAI版の公開実装を取り外しました。</p>
      <p><a class="button button-dark" href="/ja/png-compressor/">PNG圧縮を使う →</a></p>
    </section>
    <section class="content-section">
      <div class="section-kicker">STATUS</div>
      <h2>軽さと実用性を満たす方法が見つかるまで再検討します。</h2>
      <p id="modelCacheStatus">旧モデルキャッシュを確認しています。</p>
      <button class="button button-dark" id="removeModelCache" type="button" disabled>旧AIモデルキャッシュを削除</button>
    </section>
  </main>
  <footer><div><a class="brand footer-brand" href="/"><span>SHIAGENT</span></a><p>つくる。整える。仕上げる。</p></div><small>© SHIAGENT</small></footer>
  <script type="module">
    const cacheName = "shiagent-local-ai-sd-turbo-v1";
    const status = document.querySelector("#modelCacheStatus");
    const button = document.querySelector("#removeModelCache");
    const refresh = async () => {
      const exists = await caches.has(cacheName);
      status.textContent = exists ? "このブラウザに旧AIモデルが保存されています。" : "旧AIモデルはこのブラウザに保存されていません。";
      button.disabled = !exists;
    };
    button.addEventListener("click", async () => {
      button.disabled = true;
      await caches.delete(cacheName);
      await refresh();
    });
    refresh();
  </script>
</body>
</html>
