<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG白塗り 手動補助エディター | SHIAGENT</title><meta name="description" content="SVG白塗りの隙間補完と除外領域を手動指定するブラウザ内エディター。"><link rel="stylesheet" href="/assets/css/site.css"><script type="module" src="/assets/js/svg-white-fill-editor.js"></script><script type="module" src="/assets/js/workflow-handoff.js"></script></head>
<body class="editor-page"><header class="site-header"><a class="brand" href="/"><span>SHIAGENT</span><small>シアゲント</small></a><nav><a href="/ja/svg-white-fill/">← SVG白塗りへ戻る</a></nav><div class="language"><span aria-current="page">日本語</span></div></header>
<main class="svg-editor" id="tool">
  <div class="editor-topbar"><div><a class="editor-back" href="/ja/svg-white-fill/">← 戻る</a><span class="setting-number">MANUAL EDITOR</span><strong id="fileStatus">SVGを選択してください</strong></div><div class="editor-nav"><div class="editor-zoom"><button type="button" id="zoomOutButton" aria-label="縮小">−</button><button type="button" id="resetZoomButton">100%</button><button type="button" id="zoomInButton" aria-label="拡大">＋</button></div><button class="button button-light" id="previousButton" type="button">← 前へ</button><button class="button button-light" id="skipButton" type="button">次へ →</button><button class="button button-dark" id="saveNextButton" type="button">確定して次へ →</button></div></div>
  <div class="editor-layout">
    <aside class="editor-sidebar">
      <input id="fileInput" type="file" accept="image/svg+xml,.svg" multiple hidden>
      <button class="button button-dark editor-select" id="selectButton" type="button">SVGを選択</button>
      <div class="editor-group"><h2>編集モード</h2><label class="editor-mode"><input type="radio" name="editMode" value="close" checked><span><b>隙間を閉じる</b><small>2点をクリックして補助線</small></span></label><label class="editor-mode"><input type="radio" name="editMode" value="exclude"><span><b>白塗りしない</b><small>除外する領域をクリック</small></span></label><label class="editor-mode"><input type="radio" name="editMode" value="erase"><span><b>消しゴム</b><small>最寄りの編集指定を削除</small></span></label></div>
      <div class="editor-group"><label class="editor-field"><span>自動補完</span><select id="presetInput"><option value="strict">厳密</option><option value="standard" selected>標準</option><option value="precise">高精度</option></select></label></div>
      <div class="editor-group editor-button-stack"><button class="button button-light" id="undoButton" type="button">1操作戻す</button><button class="button button-light" id="clearEditsButton" type="button">編集指定を全解除</button><button class="button button-dark" id="previewButton" type="button">プレビュー更新</button><p>編集後はプレビュー更新で白塗りを再計算します。</p></div>
      <div class="editor-group editor-stats"><h2>保存情報</h2><dl><div><dt>元SVG</dt><dd id="originalSize">—</dd></div><div><dt>完成予想</dt><dd id="outputSize">—</dd></div><div><dt>閉領域</dt><dd id="regionCount">—</dd></div><div><dt>補助線</dt><dd id="lineCount">0本</dd></div><div><dt>除外指定</dt><dd id="excludeCount">0箇所</dd></div></dl><button class="button button-accent" id="downloadButton" type="button" disabled>SVGを保存 <span>↓</span></button></div>
    </aside>
    <section class="editor-workspace" id="editorDropZone"><div class="editor-canvas-wrap"><canvas id="editorCanvas" aria-label="SVG白塗り編集キャンバス"></canvas><div class="editor-empty" id="emptyMessage"><strong>SVGをここにドロップ</strong><span>または左のボタンから選択</span></div></div><div class="editor-help"><span class="red-mark"></span>補助線・始点 <span class="blue-mark">×</span>白塗り除外 <span>Ctrl+Z: 戻す</span><span>P: プレビュー更新</span><span>Ctrl+ホイール: 拡大縮小</span><span>中央ドラッグ: 移動</span></div></section>
  </div>
</main><div class="toast" id="toast"></div></body></html>
