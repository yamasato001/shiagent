<!doctype html>
<meta charset="utf-8">
<title>PNG compressor UI flow test</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="/ja/image-compressor/" hidden></iframe>
<script type="module">
const result = document.querySelector("#result");
const frame = document.querySelector("#app");

function waitFor(predicate, timeout = 30000) {
  const started = performance.now();
  return new Promise((resolve, reject) => {
    const check = () => {
      const value = predicate();
      if (value) resolve(value);
      else if (performance.now() - started > timeout) reject(new Error("Timed out waiting for UI state"));
      else setTimeout(check, 50);
    };
    check();
  });
}

async function makePng(name, paint) {
  const canvas = document.createElement("canvas");
  canvas.width = 192;
  canvas.height = 128;
  const context = canvas.getContext("2d");
  paint(context, canvas.width, canvas.height);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  return new File([blob], name, { type: "image/png", lastModified: 1 });
}

try {
  await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
  const files = await Promise.all([
    makePng("line.png", (context, width, height) => {
      context.fillStyle = "white";
      context.fillRect(0, 0, width, height);
      context.strokeStyle = "black";
      context.lineWidth = 1;
      for (let y = 10; y < height; y += 8) {
        context.beginPath();
        context.moveTo(5, y + .35);
        context.lineTo(width - 5, y + .35);
        context.stroke();
      }
    }),
    makePng("flat.png", (context, width, height) => {
      context.fillStyle = "#f0c030";
      context.fillRect(0, 0, width / 2, height);
      context.fillStyle = "#2050b0";
      context.fillRect(width / 2, 0, width / 2, height / 2);
      context.fillStyle = "#d03050";
      context.fillRect(width / 2, height / 2, width / 2, height / 2);
    }),
    makePng("tone.png", (context, width, height) => {
      const image = context.createImageData(width, height);
      let state = 0x12345678;
      for (let y = 0; y < height; y += 1) for (let x = 0; x < width; x += 1) {
        const i = (y * width + x) * 4;
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const base = 40 + ((state >>> 24) % 176);
        image.data[i] = base;
        image.data[i + 1] = Math.max(0, Math.min(255, base + (x % 41) - 20));
        image.data[i + 2] = Math.max(0, Math.min(255, base + (y % 41) - 20));
        image.data[i + 3] = 255;
      }
      context.putImageData(image, 0, 0);
    })
  ]);

  const document = frame.contentDocument;
  const transfer = new DataTransfer();
  files.forEach(file => transfer.items.add(file));
  const input = document.querySelector("#fileInput");
  input.files = transfer.files;
  input.dispatchEvent(new Event("change", { bubbles: true }));
  await waitFor(() => document.querySelectorAll(".file-row").length === 3);
  document.querySelector("#compressButton").click();
  await waitFor(() => document.querySelectorAll(".file-row .file-status.done").length === 3);

  const modes = [...document.querySelectorAll(".file-meta")].map(node => node.textContent.split("·").pop().trim());
  const detection = document.querySelector("#detectionSummary").textContent;
  const resultStatus = document.querySelector("#resultStatus").textContent;
  const badges = [...document.querySelectorAll(".result-badges span")].map(node => node.textContent);
  const comparisons = document.querySelectorAll(".file-row.has-result .file-compare img").length;
  const autoPass = modes.includes("Line Art") && modes.includes("Smallest") && modes.includes("Balanced") &&
    detection.includes("線画 1") && detection.includes("イラスト 1") && detection.includes("写真 1") &&
    resultStatus.includes("3 / 3") && badges.includes("細線保護") && badges.includes("最大64色") &&
    badges.includes("最大256色") && badges.includes("透明度維持") && comparisons === 6;

  document.querySelector('input[name="mode"][value="exact"]').click();
  document.querySelector("#compressButton").click();
  await waitFor(() => document.querySelectorAll(".file-row .file-status.done").length === 3);
  const exactBadges = [...document.querySelectorAll(".result-badges span")].map(node => node.textContent);
  const exactPass = exactBadges.includes("画素変更なし") && exactBadges.includes("ロスレス") &&
    exactBadges.includes("透明度維持") && document.querySelectorAll(".file-row.has-result .file-compare img").length === 6;
  result.textContent = JSON.stringify({
    status: autoPass && exactPass ? "PASS" : "FAIL",
    modes,
    badges,
    exactBadges: [...new Set(exactBadges)],
    comparisons,
    detection,
    resultStatus
  });
} catch (error) {
  result.textContent = JSON.stringify({ status: "ERROR", error: error.message });
}
</script>
